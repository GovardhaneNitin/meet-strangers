# Production stack: Caddy (HTTPS), the app, and a coturn TURN server.
#
#   cp .env.example .env   # set DOMAIN, TURN_URLS, TURN_SECRET, TURN_REALM, TURN_EXTERNAL_IP
#   docker compose up -d --build
#
# Point DOMAIN's DNS record at this host and open ports 80 and 443 before
# starting: Caddy needs them to obtain the certificate. Browsers only grant
# camera and microphone access over HTTPS.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build: .
    image: meet-strangers:latest
    restart: unless-stopped
    env_file: .env
    # Derived from this topology so they cannot drift from it.
    environment:
      ALLOWED_ORIGINS: https://${DOMAIN:?DOMAIN must be set}
      TRUST_PROXY_HOPS: '1'
    # Only reachable through Caddy (and from the host for debugging).
    ports:
      - '127.0.0.1:8080:8080'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    # TURN allocates a wide UDP port range; host networking avoids publishing
    # thousands of ports through Docker's proxy.
    network_mode: host
    volumes:
      - ./deploy/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET must be set}
      - --realm=${TURN_REALM:-meet.example.com}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP must be set}
    security_opt:
      - no-new-privileges:true

volumes:
  # Certificates and ACME account; keeping them avoids Let's Encrypt rate limits.
  caddy_data:
  caddy_config:
