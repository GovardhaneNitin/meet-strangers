# coturn configuration for Meet Strangers.
# Secrets and host-specific values are passed on the command line (see docker-compose.yml).

listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

# Time-limited credentials (TURN REST API) signed with static-auth-secret.
# The app issues them per chat; static users are not configured on purpose.
use-auth-secret
fingerprint

# TLS for turns: (mount your certificate and uncomment).
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# --- Security hardening ---------------------------------------------------
# A TURN server relays traffic to arbitrary peers. Without these rules,
# anyone with credentials could use it to reach internal networks (SSRF).
# Loopback peers are denied by default since coturn 4.6.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Per-user and total quotas limit relay abuse.
user-quota=12
total-quota=1200
max-bps=3000000
stale-nonce=600

no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
log-file=stdout
pidfile=/var/tmp/turnserver.pid
simple-log
